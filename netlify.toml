# FINDA Investor Pitch — independent static website
# This configuration affects only adebimpe476/finda-investor-pitch.
# It does not modify FINDA production or the GitLab showroom.
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
